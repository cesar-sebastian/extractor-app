services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applica
      POSTGRES_PASSWORD: applica
      POSTGRES_DB: applica
      APP_DB_PASSWORD: applica_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applica -d applica"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://applica_app:applica_app@postgres:5432/applica
      DATABASE_MIGRATION_URL: postgres://applica:applica@postgres:5432/applica
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@applica.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-pass-123}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
